<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="2350" viewBox="0 0 2200 2350">
<rect x="0" y="0" width="2200" height="2350" fill="#FFFFFF"/>
<defs>
<marker id="arrowhead-2F6FED" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><polygon points="0 0, 9 3, 0 6" fill="#2F6FED"/></marker>
<marker id="arrowhead-1E9E5A" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><polygon points="0 0, 9 3, 0 6" fill="#1E9E5A"/></marker>
<marker id="arrowhead-6B7280" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><polygon points="0 0, 9 3, 0 6" fill="#6B7280"/></marker>
<marker id="arrowhead-C77D18" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><polygon points="0 0, 9 3, 0 6" fill="#C77D18"/></marker>
<marker id="arrowhead-E07A1F" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><polygon points="0 0, 9 3, 0 6" fill="#E07A1F"/></marker>
<marker id="arrowhead-D03A2C" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><polygon points="0 0, 9 3, 0 6" fill="#D03A2C"/></marker>
